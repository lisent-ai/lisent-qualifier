services:
  phoneinfoga:
    image: sundowndev/phoneinfoga:latest
    container_name: lisent-osint-phoneinfoga
    restart: unless-stopped
    command: ["serve", "-p", "5000"]
    ports:
      - "127.0.0.1:5055:5000"
    networks:
      - osint-net
    environment:
      # Optional upstream API keys for deeper phone OSINT.
      # Without these, phoneinfoga still does local E.164 parsing (country, line_type guess, carrier heuristics).
      # Set via .env at same folder, or Dokploy environment UI.
      - NUMVERIFY_API_KEY=${NUMVERIFY_API_KEY:-}
      - GOOGLECSE_CX=${GOOGLECSE_CX:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  holehe-api:
    build:
      context: ./holehe-api
    image: lisent/holehe-api:local
    container_name: lisent-osint-holehe-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:18001:8000"
    networks:
      - osint-net
    environment:
      - HOLEHE_DEFAULT_TIMEOUT=${HOLEHE_DEFAULT_TIMEOUT:-4.0}
      - HOLEHE_MAX_CONCURRENCY=${HOLEHE_MAX_CONCURRENCY:-20}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  osint-net:
    name: lisent-osint-net
    driver: bridge
