services:
  ai-lead-qualifier:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: production
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      DATABASE_URL: ${DATABASE_URL}
      REDIS_DSN: ${REDIS_DSN}

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-5}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-4096}

      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:8080}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3.5-9b}
      LOCAL_LLM_TIMEOUT_CHAMP: ${LOCAL_LLM_TIMEOUT_CHAMP:-60}
      LOCAL_LLM_TIMEOUT_REASONING: ${LOCAL_LLM_TIMEOUT_REASONING:-45}

      CRM_BASE_URL: ${CRM_BASE_URL}
      CRM_API_KEY: ${CRM_API_KEY}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL}
      CRM_WEBHOOK_TOKEN: ${CRM_WEBHOOK_TOKEN}
      CRM_WEBHOOK_TIMEOUT: ${CRM_WEBHOOK_TIMEOUT:-10}

      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      WHATSAPP_WEBHOOK_TOKEN: ${WHATSAPP_WEBHOOK_TOKEN}
      GREENAPI_BASE_URL: ${GREENAPI_BASE_URL:-https://api.green-api.com}
      GREENAPI_REPLY_TIMEOUT: ${GREENAPI_REPLY_TIMEOUT:-8}

      HIGH_THRESHOLD: ${HIGH_THRESHOLD:-80}
      CHAMP_EXTRACT_EVERY_N_MESSAGES: ${CHAMP_EXTRACT_EVERY_N_MESSAGES:-3}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}

      QUALIFICATION_JUDGE_MODEL: ${QUALIFICATION_JUDGE_MODEL:-llama-3.3-70b-versatile}
      QUALIFIER_CRM_WRITETHROUGH_ENABLED: ${QUALIFIER_CRM_WRITETHROUGH_ENABLED:-true}
      QUALIFIER_LEGACY_API_ENABLED: ${QUALIFIER_LEGACY_API_ENABLED:-true}
      RAG_WEBHOOK_ENABLED: ${RAG_WEBHOOK_ENABLED:-false}

      # Phase 2 — multi-tenant v1 public API secrets. Both MUST be set in
      # Dokploy (no defaults — empty value disables the relevant auth path).
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}

      # Phase 3 — OSINT-enriched LLM judge pre-scoring pipeline.
      # All gated OFF by default for safe rollout. Flip in Dokploy Environment
      # AFTER migration 004 + lisent-osint-stack deployed.
      PRESCORE_WORKER_ENABLED: ${PRESCORE_WORKER_ENABLED:-false}
      OSINT_ENABLED: ${OSINT_ENABLED:-false}
      OSINT_PHONEINFOGA_URL: ${OSINT_PHONEINFOGA_URL:-http://phoneinfoga:5000}
      OSINT_HOLEHE_URL: ${OSINT_HOLEHE_URL:-http://holehe-api:8000}
      OSINT_PROFILE_STALE_DAYS: ${OSINT_PROFILE_STALE_DAYS:-60}
      OSINT_REQUEST_TIMEOUT_S: ${OSINT_REQUEST_TIMEOUT_S:-15.0}
      OSINT_HOLEHE_TIMEOUT_PER_MODULE: ${OSINT_HOLEHE_TIMEOUT_PER_MODULE:-4.0}
      PRE_SCORE_JUDGE_MAX_TOKENS: ${PRE_SCORE_JUDGE_MAX_TOKENS:-2048}
      PRE_SCORE_JUDGE_TIMEOUT: ${PRE_SCORE_JUDGE_TIMEOUT:-12}
      PRE_SCORE_DIVERGENCE_THRESHOLD: ${PRE_SCORE_DIVERGENCE_THRESHOLD:-20}
      # Phase 7.B — inbound CRM webhook listener (replaces REST PATCH).
      # Dual-write default: listener OFF + REST ON. Flip listener to true once
      # the CRM side endpoint is deployed; leave REST true for 1 week of
      # parallel-running, then set PRESCORE_CRM_REST_ENABLED=false.
      CRM_INTERNAL_WEBHOOK_URL: ${CRM_INTERNAL_WEBHOOK_URL:-}
      CRM_INTERNAL_WEBHOOK_SECRET: ${CRM_INTERNAL_WEBHOOK_SECRET:-}
      CRM_WEBHOOK_LISTENER_ENABLED: ${CRM_WEBHOOK_LISTENER_ENABLED:-false}
      PRESCORE_CRM_REST_ENABLED: ${PRESCORE_CRM_REST_ENABLED:-true}
      CRM_INTERNAL_WEBHOOK_TIMEOUT: ${CRM_INTERNAL_WEBHOOK_TIMEOUT:-5.0}
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
